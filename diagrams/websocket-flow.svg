<svg width="100%" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .box { fill:#081224; rx:6; }
    .title { fill:#E5E7EB; font-size:13px; font-weight:600; font-family:system-ui; }
    .text { fill:#9CA3AF; font-size:12px; font-family:system-ui; }
    .line { stroke-width:1.6; }
  </style>

  <!-- HEADERS -->
  <rect x="80" y="20" width="120" height="44" rx="10" fill="#1D4ED8"/>
  <text x="140" y="44" text-anchor="middle" class="title">Client</text>

  <rect x="520" y="20" width="160" height="44" rx="10" fill="#065F46"/>
  <text x="600" y="44" text-anchor="middle" class="title">Server — Node.js</text>

  <!-- LIFELINES -->
  <line x1="140" y1="70" x2="140" y2="500" stroke="#6B7280" stroke-dasharray="5 4"/>
  <line x1="600" y1="70" x2="600" y2="500" stroke="#6B7280" stroke-dasharray="5 4"/>

  <!-- FLOW 1 -->
  <rect x="20" y="90" width="680" height="22" rx="4" fill="#1D4ED820"/>
  <text x="36" y="104" class="title" fill="#93C5FD">CLIENT JOINS ROOM</text>

  <line x1="145" y1="130" x2="595" y2="130" class="line" stroke="#93C5FD" marker-end="url(#arrow)"/>
  <rect x="260" y="115" width="160" height="24" class="box"/>
  <text x="340" y="130" text-anchor="middle" class="text">join-room event</text>

  <line x1="595" y1="162" x2="145" y2="162" class="line" stroke="#34D399" marker-end="url(#arrow)"/>
  <rect x="240" y="147" width="240" height="24" class="box"/>
  <text x="360" y="162" text-anchor="middle" class="text">adds client + sends latest state</text>

  <!-- FLOW 2 -->
  <rect x="20" y="190" width="680" height="22" rx="4" fill="#F59E0B30"/>
  <text x="36" y="204" class="title" fill="#FBBF24">CLIENT EDITS CODE</text>

  <line x1="145" y1="230" x2="595" y2="230" class="line" stroke="#FBBF24" marker-end="url(#arrow)"/>
  <rect x="250" y="215" width="200" height="24" class="box"/>
  <text x="350" y="230" text-anchor="middle" class="text">"code-change" event</text>

  <rect x="520" y="262" width="160" height="24" rx="6" fill="#78350F"/>
  <text x="600" y="277" text-anchor="middle" class="text" fill="#FCD34D">applies OT, publishes</text>

  <line x1="595" y1="294" x2="145" y2="294" class="line" stroke="#34D399" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <rect x="240" y="279" width="240" height="24" class="box"/>
  <text x="360" y="294" text-anchor="middle" class="text">update → all clients</text>

  <!-- FLOW 3 -->
  <rect x="20" y="320" width="680" height="22" rx="4" fill="#6366F130"/>
  <text x="36" y="334" class="title" fill="#C7D2FE">CLIENT MOVES CURSOR</text>

  <line x1="145" y1="360" x2="595" y2="360" class="line" stroke="#C7D2FE" marker-end="url(#arrow)"/>
  <rect x="250" y="345" width="200" height="24" class="box"/>
  <text x="350" y="360" text-anchor="middle" class="text">"cursor-move" event</text>

  <rect x="520" y="392" width="160" height="24" rx="6" fill="#3730A3"/>
  <text x="600" y="407" text-anchor="middle" class="text" fill="#C7D2FE">broadcasts to room</text>

  <line x1="595" y1="424" x2="145" y2="424" class="line" stroke="#A5B4FC" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <rect x="230" y="409" width="260" height="24" class="box"/>
  <text x="360" y="424" text-anchor="middle" class="text">remote cursors rendered</text>

  <!-- FLOW 4 -->
  <rect x="20" y="450" width="680" height="22" rx="4" fill="#EC489930"/>
  <text x="36" y="464" class="title" fill="#F9A8D4">CLIENT SENDS CHAT</text>

  <line x1="145" y1="490" x2="595" y2="490" class="line" stroke="#F9A8D4" marker-end="url(#arrow)"/>
  <rect x="260" y="475" width="160" height="24" class="box"/>
  <text x="340" y="490" text-anchor="middle" class="text">"chat" event</text>

</svg>