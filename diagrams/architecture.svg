<svg width="100%" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glowBlue"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.4"/></filter>
    <filter id="glowPurple"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.4"/></filter>
    <filter id="glowCyan"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.4"/></filter>
    <filter id="glowPink"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EC4899" flood-opacity="0.4"/></filter>
  </defs>

  <style>
    .box { fill:#0B1220; stroke-width:1.5; rx:14; }
    .title { fill:#E5E7EB; font-size:15px; font-weight:600; font-family:system-ui; }
    .sub { fill:#9CA3AF; font-size:12px; font-family:system-ui; }
    .label { fill:#6B7280; font-size:12px; font-family:system-ui; letter-spacing:0.05em; }
    .line { stroke:#6B7280; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>

  <!-- CLIENT -->
  <rect x="80" y="240" width="180" height="90"
    class="box" stroke="#3B82F6" filter="url(#glowBlue)"/>
  <text x="170" y="275" text-anchor="middle" class="title">Client</text>
  <text x="170" y="300" text-anchor="middle" class="sub">React + Monaco</text>

  <!-- SERVER CONTAINER -->
  <rect x="320" y="60" width="600" height="480" rx="20"
    fill="none" stroke="#374151" stroke-dasharray="6 3"/>
  <text x="340" y="90" class="title">Server (Node.js + Express)</text>

  <!-- SECTION LABELS -->
  <text x="350" y="140" class="label">CORE SYSTEMS</text>
  <text x="350" y="300" class="label">COLLAB ENGINE</text>
  <text x="350" y="460" class="label">EXECUTION</text>

  <!-- CORE -->
  <rect x="380" y="160" width="140" height="70"
    class="box" stroke="#F59E0B" filter="url(#glowPurple)"/>
  <text x="450" y="200" text-anchor="middle" class="title">Room Manager</text>

  <rect x="560" y="160" width="140" height="70"
    class="box" stroke="#A855F7" filter="url(#glowPurple)"/>
  <text x="630" y="200" text-anchor="middle" class="title">PubSub</text>

  <rect x="740" y="160" width="140" height="70"
    class="box" stroke="#22C55E" filter="url(#glowPurple)"/>
  <text x="810" y="200" text-anchor="middle" class="title">Event Bus</text>

  <!-- ENGINE -->
  <rect x="470" y="320" width="140" height="70"
    class="box" stroke="#06B6D4" filter="url(#glowCyan)"/>
  <text x="540" y="360" text-anchor="middle" class="title">OT Engine</text>

  <rect x="650" y="320" width="140" height="70"
    class="box" stroke="#0EA5E9" filter="url(#glowCyan)"/>
  <text x="720" y="360" text-anchor="middle" class="title">Version Store</text>

  <!-- EXEC -->
  <rect x="560" y="460" width="140" height="70"
    class="box" stroke="#EC4899" filter="url(#glowPink)"/>
  <text x="630" y="500" text-anchor="middle" class="title">Code Executor</text>

  <!-- CONNECTIONS -->

  <path d="M260 285 C320 285, 340 200, 380 195" class="line"/>

  <path d="M520 195 C540 195, 540 195, 560 195" class="line"/>
  <path d="M700 195 C720 195, 720 195, 740 195" class="line"/>

  <path d="M450 230 C450 270, 520 290, 540 320" class="line"/>
  <path d="M630 230 C630 270, 700 290, 720 320" class="line"/>

  <path d="M610 355 C630 355, 630 355, 650 355" class="line"/>

  <path d="M540 390 C540 430, 610 440, 630 460" class="line"/>
  <path d="M720 390 C720 430, 650 440, 630 460" class="line"/>

</svg>